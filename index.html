<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Delivery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background: #ff4d4d;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
    }

    .card:hover {
      transform: scale(1.05);
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #ff4d4d;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    #productos, #carrito, #formulario {
      display: none;
      padding: 20px;
    }

    .producto {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
    }

    .carrito-item {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

  </style>
</head>
<body>

  <header>Mi App de Delivery</header>

  <!-- Lista de locales -->
  <section id="locales" class="grid"></section>

  <!-- Productos -->
  <section id="productos">
    <h2 id="titulo-local"></h2>
    <div id="lista-productos"></div>
    <button onclick="mostrarCarrito()">Ver Carrito</button>
  </section>

  <!-- Carrito -->
  <section id="carrito">
    <h2>Carrito de Compras</h2>
    <div id="lista-carrito"></div>
    <button onclick="mostrarFormulario()">Pagar</button>
  </section>

  <!-- Formulario -->
  <section id="formulario">
    <h2>Datos del Cliente</h2>
    <form onsubmit="finalizarCompra(event)">
      <input type="text" placeholder="Nombre" required>
      <input type="text" placeholder="Dirección" required>
      <input type="tel" placeholder="Teléfono" required>
      <button type="submit">Finalizar Pedido</button>
    </form>
  </section>

  <script>
    const locales = [
      { nombre: "Pizzería Italia", productos: ["Pizza Margarita", "Pizza Pepperoni", "Lasaña"] },
      { nombre: "Hamburguesas Max", productos: ["Hamburguesa Doble", "Papas Fritas", "Refresco"] },
      { nombre: "Pollo Express", productos: ["Pollo Frito", "Alitas BBQ", "Puré de Papas"] },
      { nombre: "Tacos El Rey", productos: ["Taco de Carne", "Taco Pastor", "Quesadilla"] },
      { nombre: "Café Central", productos: ["Capuchino", "Latte", "Pan Dulce"] },
      { nombre: "Sushi House", productos: ["Sushi Roll", "Tempura", "Sopa Miso"] },
      { nombre: "Chifa Oriental", productos: ["Arroz Chaufa", "Pollo Agridulce", "Wantán"] },
      { nombre: "Panadería Dulce Hogar", productos: ["Pan de Queso", "Croissant", "Pastel"] },
      { nombre: "Helados Frosty", productos: ["Helado Vainilla", "Helado Chocolate", "Banana Split"] },
      { nombre: "Mariscos Don Pepe", productos: ["Ceviche", "Camarones", "Sopa de Mariscos"] },
      { nombre: "Parrilla Grill", productos: ["Carne Asada", "Chorizo", "Ensalada"] },
      { nombre: "Veggie Life", productos: ["Ensalada Verde", "Hamburguesa Vegana", "Smoothie"] },
      { nombre: "Comida Rápida Express", productos: ["Hot Dog", "Nachos", "Pizza Personal"] }
    ];

    let carrito = [];

    const seccionLocales = document.getElementById("locales");
    const seccionProductos = document.getElementById("productos");
    const seccionCarrito = document.getElementById("carrito");
    const seccionFormulario = document.getElementById("formulario");
    const listaProductos = document.getElementById("lista-productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const tituloLocal = document.getElementById("titulo-local");

    // Mostrar locales
    locales.forEach((local, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = local.nombre;
      card.onclick = () => mostrarProductos(i);
      seccionLocales.appendChild(card);
    });

    function mostrarProductos(index) {
      seccionLocales.style.display = "none";
      seccionCarrito.style.display = "none";
      seccionFormulario.style.display = "none";
      seccionProductos.style.display = "block";

      tituloLocal.textContent = locales[index].nombre;
      listaProductos.innerHTML = "";

      locales[index].productos.forEach(producto => {
        const div = document.createElement("div");
        div.className = "producto";
        div.innerHTML = `${producto} <button onclick="agregarCarrito('${producto}')">Agregar</button>`;
        listaProductos.appendChild(div);
      });
    }

    function agregarCarrito(producto) {
      carrito.push(producto);
      alert(producto + " agregado al carrito!");
    }

    function mostrarCarrito() {
      seccionProductos.style.display = "none";
      seccionLocales.style.display = "none";
      seccionFormulario.style.display = "none";
      seccionCarrito.style.display = "block";

      listaCarrito.innerHTML = "";
      carrito.forEach(item => {
        const div = document.createElement("div");
        div.className = "carrito-item";
        div.textContent = item;
        listaCarrito.appendChild(div);
      });
    }

    function mostrarFormulario() {
      seccionCarrito.style.display = "none";
      seccionFormulario.style.display = "block";
    }

    function finalizarCompra(event) {
      event.preventDefault();
      alert("¡Pedido realizado con éxito! Gracias por su compra.");
      carrito = [];
      location.reload();
    }
  </script>
<script>
  function finalizarCompra(event) {
    event.preventDefault();
    const nombre = event.target[0].value;
    const direccion = event.target[1].value;
    const telefono = event.target[2].value;

    const pedido = {
      cliente: nombre,
      direccion: direccion,
      telefono: telefono,
      productos: carrito,
      estado: "Pendiente",
      timestamp: Date.now() // Guardamos el momento exacto de la orden
    };

    // Guardamos en localStorage (simulando que se manda al repartidor)
    let pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
    pedidos.push(pedido);
    localStorage.setItem("pedidos", JSON.stringify(pedidos));

    alert("¡Pedido realizado con éxito! El repartidor lo recibirá.");
    carrito = [];
    location.href = "repartidor.html"; 
  }
</script>
</body>
</html>
