<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Repartidor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    header { background: #4CAF50; color: #fff; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; }
    .pedido { background: #fff; margin: 15px; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h3 { margin: 5px 0; }
    button { margin-top: 10px; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; color: #fff; }
    .btn-aceptar { background: #2196F3; }
    .btn-finalizar { background: #4CAF50; }
    .expirado { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <header>Panel del Repartidor</header>
  <section id="lista-pedidos"></section>

  <script>
    const DURACION_PEDIDO = 30 * 60 * 1000; // 30 minutos en ms

    function cargarPedidos() {
      let pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
      const lista = document.getElementById("lista-pedidos");
      lista.innerHTML = "";

      pedidos.forEach((pedido, index) => {
        const tiempoRestante = DURACION_PEDIDO - (Date.now() - pedido.timestamp);

        // Si ya pasaron los 30 minutos → marcar como expirado
        if (tiempoRestante <= 0 && pedido.estado !== "Entregado") {
          pedido.estado = "Expirado";
        }

        const minutos = Math.floor(tiempoRestante / 60000);
        const segundos = Math.floor((tiempoRestante % 60000) / 1000);

        const div = document.createElement("div");
        div.className = "pedido";
        div.innerHTML = `
          <h3>Cliente: ${pedido.cliente}</h3>
          <p><b>Dirección:</b> ${pedido.direccion}</p>
          <p><b>Teléfono:</b> ${pedido.telefono}</p>
          <p><b>Productos:</b> ${pedido.productos.join(", ")}</p>
          <p><b>Estado:</b> ${pedido.estado}</p>
          ${pedido.estado !== "Expirado" && pedido.estado !== "Entregado" 
            ? `<p><b>Tiempo restante:</b> ${minutos}:${segundos < 10 ? "0" : ""}${segundos}</p>` 
            : `<p class="expirado">Pedido ${pedido.estado}</p>`}
          <div>
            ${pedido.estado === "Pendiente" 
              ? `<button class="btn-aceptar" onclick="actualizarEstado(${index}, 'En camino')">Aceptar</button>` 
              : ""}
            ${pedido.estado === "En camino" 
              ? `<button class="btn-finalizar" onclick="actualizarEstado(${index}, 'Entregado')">Finalizar</button>` 
              : ""}
          </div>
        `;
        lista.appendChild(div);
      });

      localStorage.setItem("pedidos", JSON.stringify(pedidos));
    }

    function actualizarEstado(index, nuevoEstado) {
      let pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
      pedidos[index].estado = nuevoEstado;
      localStorage.setItem("pedidos", JSON.stringify(pedidos));
      cargarPedidos();
    }

    // Refrescar pedidos cada segundo (actualiza cuenta regresiva)
    setInterval(cargarPedidos, 1000);

    cargarPedidos();
  </script>
</body>
</html>
